<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ปฏิทินค่าแรง รปภ. บ.PCS (24 ช่องแรก, แนวนอน)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #eef2f7;
            font-family: 'Segoe UI', 'Roboto', 'Noto Sans', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .calendar-card {
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.2);
            padding: 1.5rem 1rem 1.2rem 1rem;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .calendar-content {
            flex: 1;
            min-width: 0;
        }
        .nav-arrow {
            background: white;
            border: none;
            font-size: 2.8rem;
            width: 64px;
            height: 64px;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(0,0,0,0.1);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2c5a74;
            font-weight: bold;
            background-color: #fef9e6;
            flex-shrink: 0;
        }
        .nav-arrow:hover {
            background-color: #ffedd5;
            transform: scale(1.02);
            color: #b45309;
        }
        .nav-arrow:active {
            transform: scale(0.96);
        }
        .company-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #b45309;
            background: #fff0df;
            display: inline-block;
            padding: 0.2rem 1.6rem;
            border-radius: 60px;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-align: center;
        }
        .month-year-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e3a4b;
            background: #eef2fc;
            display: inline-block;
            padding: 0.2rem 1.2rem;
            border-radius: 48px;
        }
        .date-range-info {
            font-size: 0.8rem;
            background: #fef3e8;
            margin-top: 6px;
            display: inline-block;
            padding: 4px 14px;
            border-radius: 30px;
            color: #b45309;
        }
        .legend-dynamic {
            font-size: 0.75rem;
            margin-top: 6px;
            background: #f8fafc;
            display: inline-block;
            padding: 3px 12px;
            border-radius: 28px;
            color: #1f5e7e;
        }
        .calendar-table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            table-layout: fixed;
            margin-top: 12px;
            display: table;
        }
        .calendar-table thead,
        .calendar-table tbody,
        .calendar-table tr {
            display: table-row-group;
        }
        .calendar-table tr {
            display: table-row;
        }
        .calendar-table th {
            display: table-cell;
            font-size: 0.85rem;
            font-weight: 700;
            color: #1f3a4b;
            background-color: #eef3fc;
            padding: 10px 4px;
            border: 1px solid #cfe0ec;
            text-align: center;
            width: 14.28%;
        }
        .calendar-table td {
            display: table-cell;
            position: relative;
            border: 1px solid #dee8f0;
            text-align: center;
            vertical-align: middle;
            padding: 12px 2px;
            font-weight: 600;
            font-size: 1.25rem;
            cursor: pointer;
            transition: background 0.1s;
        }
        .calendar-table td.empty-cell {
            background-color: #f9fbfd;
            border: 1px solid #e2ecf3;
            color: #b9cfdf;
            cursor: default;
        }
        .color-range-blue {
            background-color: #2c6eec !important;
            color: white;
        }
        .color-range-orange {
            background-color: #f55c0a !important;
            color: white;
        }
        .today-cell {
            color: #b91c1c !important;
            font-weight: 900 !important;
            font-size: 1.4rem;
            text-decoration: underline;
            text-decoration-thickness: 3px;
            text-underline-offset: 5px;
            text-decoration-color: #b91c1c;
        }
        .color-range-blue.today-cell,
        .color-range-orange.today-cell {
            color: #e61919 !important;
            text-shadow: 0 0 2px rgba(255,255,200,0.6);
        }
        .event-star {
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 1.0rem;
            color: #FFD966;
            text-shadow: 0 0 2px #b97f0e;
            font-weight: bold;
            pointer-events: none;
        }
        .event-detail-panel {
            margin-top: 18px;
            background: #fffaf2;
            border-radius: 24px;
            padding: 10px 16px;
            text-align: center;
            font-size: 1rem;
            font-weight: 500;
            color: #3b2a1f;
            border: 1px solid #ffe0b5;
            min-height: 75px;
        }
        .event-detail-label {
            font-size: 0.7rem;
            color: #b76e2e;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .event-detail-text {
            font-size: 1rem;
            font-weight: 600;
            color: #b45309;
        }
        footer {
            margin-top: 16px;
            text-align: center;
            font-size: 0.65rem;
            border-top: 1px solid #e2eef5;
            padding-top: 10px;
            color: #3c6e8f;
        }
        .version-badge {
            background: #eef2f5;
            font-family: monospace;
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            margin-top: 4px;
        }
        @media (max-width: 680px) {
            .calendar-card { gap: 6px; padding: 1rem 0.5rem; }
            .nav-arrow { width: 48px; height: 48px; font-size: 2rem; }
            .calendar-table td { font-size: 1rem; padding: 8px 2px; }
            .today-cell { font-size: 1.1rem; }
            .company-title { font-size: 1.2rem; padding: 0.1rem 1rem; }
            .month-year-title { font-size: 1.1rem; }
            .event-star { font-size: 0.6rem; top: 1px; right: 2px; }
        }
        @media (max-width: 550px) {
            .calendar-table th { font-size: 0.7rem; padding: 6px 2px; }
            .calendar-table td { font-size: 0.9rem; }
        }
        .calendar-table td:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
<div class="calendar-card">
    <button class="nav-arrow" id="prevMonthBtn" aria-label="เดือนก่อนหน้า">◀</button>
    <div class="calendar-content">
        <div style="text-align: center;">
            <div class="company-title">💰 ค่าแรง รปภ. บ.PCS</div>
            <div id="dynamicHeader"></div>
        </div>
        <table class="calendar-table" id="calendarTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div class="event-detail-panel" id="eventDetailPanel">
            <div class="event-detail-label">📌 รายละเอียดวันที่เลือก</div>
            <div class="event-detail-text" id="eventDetailText">คลิกที่วันใดก็ได้เพื่อแสดงข้อมูล</div>
        </div>
        <footer>
            <span id="todayNoteFooter"></span><br>
            <span class="version-badge">✨ ดาวทองวันสำคัญ • คลิกแสดงรายละเอียด • เปลี่ยนเดือนด้วยลูกศรข้างตาราง (24 อยู่ช่องแรกเสมอ)</span>
        </footer>
    </div>
    <button class="nav-arrow" id="nextMonthBtn" aria-label="เดือนถัดไป">▶</button>
</div>

<script>
    // ---------- ข้อมูลวันสำคัญ (ค.ศ.) ----------
    const eventsData = [
        { date: "2026-01-01", title: "🇹🇭 วันขึ้นปีใหม่" },
        { date: "2026-03-03", title: "🌙 วันมาฆบูชา" },
        { date: "2026-04-06", title: "👑 วันจักรี" },
        { date: "2026-04-14", title: "💧 วันสงกรานต์" },
        { date: "2026-05-01", title: "👷 วันแรงงานแห่งชาติ" },
        { date: "2026-05-31", title: "🌸 วันวิสาขบูชา" },
        { date: "2026-06-03", title: "👸 วันเฉลิมพระราชินี" },
        { date: "2026-07-28", title: "🎂 วันเฉลิมฯ ร.10" },
        { date: "2026-07-29", title: "🕯️ วันอาสาฬหบูชา" },
        { date: "2026-08-12", title: "💐 วันแม่แห่งชาติ" },
        { date: "2026-10-23", title: "🏛️ วันปิยมหาราช" },
        { date: "2026-12-05", title: "💛 วันพ่อแห่งชาติ" },
        { date: "2026-12-31", title: "🎆 วันสิ้นปี" }
    ];
    const eventMap = new Map();
    eventsData.forEach(ev => eventMap.set(ev.date, ev.title));

    const FIXED_TODAY = new Date(2026, 4, 15);   // 15 พฤษภาคม 2026
    const START_DAY_OF_MONTH = 24;   // เริ่มที่ 24 ของเดือนก่อนหน้า
    const END_DAY_OF_MONTH = 23;     // สิ้นสุดที่ 23 ของเดือนปัจจุบัน

    let currentDisplayYear = 2026;
    let currentDisplayMonth = 4;      // 4 = พฤษภาคม (0-index)

    const THAI_MONTHS_FULL = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
    const WEEKDAY_SHORT = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];

    function toBuddhistYear(date) {
        return date.getFullYear() + 543;
    }

    function formatThaiDate(year, month, day) {
        const thaiMonthsShort = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
        const monthShort = thaiMonthsShort[month];
        const yearBE = year + 543;
        return `${day} ${monthShort} ${yearBE}`;
    }

    function getEventTitle(year, month, day) {
        const key = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        return eventMap.get(key) || null;
    }

    function getDateRange(year, month) {
        let prevYear = year;
        let prevMonth = month - 1;
        if (prevMonth < 0) {
            prevMonth = 11;
            prevYear = year - 1;
        }
        const startDate = new Date(prevYear, prevMonth, START_DAY_OF_MONTH);
        const endDate = new Date(year, month, END_DAY_OF_MONTH);
        return { startDate, endDate, prevYear, prevMonth };
    }

    function getHeaderFromStartDate(startDate) {
        const startWeekday = startDate.getDay(); // 0=อาทิตย์..6=เสาร์
        const headers = [];
        for (let i = 0; i < 7; i++) {
            const idx = (startWeekday + i) % 7;
            headers.push(WEEKDAY_SHORT[idx]);
        }
        return headers;
    }

    function renderCalendar(year, month) {
        const { startDate, endDate, prevYear, prevMonth } = getDateRange(year, month);
        
        const allDates = [];
        let cursor = new Date(startDate);
        while (cursor <= endDate) {
            allDates.push(new Date(cursor));
            cursor.setDate(cursor.getDate() + 1);
        }

        const blueEndDate = new Date(year, month, 7);
        const orangeStartDate = new Date(year, month, 8);
        function getColorClass(d) {
            if (d <= blueEndDate) return 'color-range-blue';
            if (d >= orangeStartDate) return 'color-range-orange';
            return '';
        }

        function isTodayCell(d) {
            return d.getFullYear() === FIXED_TODAY.getFullYear() &&
                   d.getMonth() === FIXED_TODAY.getMonth() &&
                   d.getDate() === FIXED_TODAY.getDate();
        }

        const headers = getHeaderFromStartDate(startDate);
        const thead = document.getElementById('tableHead');
        thead.innerHTML = `<tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>`;

        // แบ่งเป็นแถวละ 7 วัน
        const rows = [];
        for (let i = 0; i < allDates.length; i += 7) {
            rows.push(allDates.slice(i, i + 7));
        }

        let tbodyHtml = '';
        for (let row of rows) {
            let rowHtml = '<tr>';
            for (let i = 0; i < 7; i++) {
                const d = row[i];
                if (!d) {
                    rowHtml += `<td class="empty-cell"></td>`;
                } else {
                    const dYear = d.getFullYear();
                    const dMonth = d.getMonth();
                    const dDay = d.getDate();
                    let colorCls = getColorClass(d);
                    const todayCls = isTodayCell(d) ? 'today-cell' : '';
                    const finalClass = `${colorCls} ${todayCls}`.trim();
                    const starHtml = getEventTitle(dYear, dMonth, dDay) ? '<span class="event-star">★</span>' : '';
                    rowHtml += `<td class="${finalClass}" data-year="${dYear}" data-month="${dMonth}" data-day="${dDay}">${dDay}${starHtml}</td>`;
                }
            }
            rowHtml += '</tr>';
            tbodyHtml += rowHtml;
        }
        
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = tbodyHtml;
        
        const prevMonthName = THAI_MONTHS_FULL[prevMonth];
        const prevYearBE = toBuddhistYear(new Date(prevYear, prevMonth, 1));
        const curMonthName = THAI_MONTHS_FULL[month];
        const curYearBE = toBuddhistYear(new Date(year, month, 1));
        
        const daysInPrevMonth = new Date(prevYear, prevMonth+1, 0).getDate();
        let legendText = (daysInPrevMonth === 31) 
            ? `🔵 สีฟ้า (24 ${prevMonthName} ${prevYearBE} – 7 ${curMonthName}) &nbsp; 🟠 สีส้ม (8 ${curMonthName} – ${END_DAY_OF_MONTH} ${curMonthName} ${curYearBE})`
            : `🔵 สีฟ้า (24 ${prevMonthName} ${prevYearBE} – 6 ${curMonthName}) &nbsp; 🟠 สีส้ม (7 ${curMonthName} – ${END_DAY_OF_MONTH} ${curMonthName} ${curYearBE})`;
        
        document.getElementById('dynamicHeader').innerHTML = `
            <div class="month-year-title">📅 ${curMonthName} ${curYearBE}</div>
            <div class="date-range-info">📌 เริ่ม 24 ${prevMonthName} ${prevYearBE} • สิ้นสุด ${END_DAY_OF_MONTH} ${curMonthName} ${curYearBE}</div>
            <div class="legend-dynamic">${legendText}</div>
        `;
        
        const todayYearBE = toBuddhistYear(FIXED_TODAY);
        const todayDateStr = `${FIXED_TODAY.getDate()} ${THAI_MONTHS_FULL[FIXED_TODAY.getMonth()]} ${todayYearBE}`;
        document.getElementById('todayNoteFooter').innerHTML = `🔴 วันปัจจุบัน : ${todayDateStr} (พื้นสีส้มตามช่วง) — ตัวหนาสีแดง + ขีดเส้นใต้`;
        
        document.getElementById('eventDetailText').innerHTML = 'คลิกที่วันใดก็ได้เพื่อแสดงข้อมูล';
        attachClickHandler();
    }
    
    function attachClickHandler() {
        const tbody = document.getElementById('tableBody');
        tbody.removeEventListener('click', tbodyClickHandler);
        tbody.addEventListener('click', tbodyClickHandler);
    }
    
    function tbodyClickHandler(e) {
        let target = e.target;
        while (target && target.tagName !== 'TD') {
            target = target.parentElement;
            if (!target) return;
        }
        if (!target) return;
        if (target.classList.contains('empty-cell')) return;
        
        const year = parseInt(target.getAttribute('data-year'));
        const month = parseInt(target.getAttribute('data-month'));
        const day = parseInt(target.getAttribute('data-day'));
        if (isNaN(year) || isNaN(month) || isNaN(day)) return;
        
        const eventTitle = getEventTitle(year, month, day);
        const dateStr = formatThaiDate(year, month, day);
        const detailDiv = document.getElementById('eventDetailText');
        if (eventTitle) {
            detailDiv.innerHTML = `📅 ${dateStr} : ${eventTitle} <span style="font-size:0.85rem;">✨</span>`;
        } else {
            detailDiv.innerHTML = `📅 ${dateStr} : ไม่มีกิจกรรมสำคัญ`;
        }
    }
    
    function shiftMonth(delta) {
        let newMonth = currentDisplayMonth + delta;
        let newYear = currentDisplayYear;
        if (newMonth < 0) {
            newMonth = 11;
            newYear--;
        } else if (newMonth > 11) {
            newMonth = 0;
            newYear++;
        }
        currentDisplayMonth = newMonth;
        currentDisplayYear = newYear;
        renderCalendar(currentDisplayYear, currentDisplayMonth);
    }
    
    document.getElementById('prevMonthBtn').addEventListener('click', () => shiftMonth(-1));
    document.getElementById('nextMonthBtn').addEventListener('click', () => shiftMonth(1));
    
    renderCalendar(2026, 4);
</script>
</body>
</html>
